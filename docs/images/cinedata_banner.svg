<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="titre desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titre">Bannière CinéData</title>
  <desc id="desc">Illustration d'un clap de cinéma et d'une pellicule, avec le titre CinéData.</desc>

  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2236"/>
      <stop offset="1" stop-color="#1f4e79"/>
    </linearGradient>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#e2704a"/>
    </linearGradient>
    <linearGradient id="nuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4c7e"/>
      <stop offset="1" stop-color="#7fb2d9"/>
    </linearGradient>
    <!-- Perforations de pellicule -->
    <pattern id="perfos" width="40" height="28" patternUnits="userSpaceOnUse">
      <rect x="10" y="7" width="20" height="14" rx="3" fill="#0f2236"/>
    </pattern>
    <clipPath id="clipCadre2"><rect x="96" y="22" width="82" height="120" rx="6"/></clipPath>
    <clipPath id="clipClap"><rect x="0" y="0" width="230" height="46" rx="6"/></clipPath>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="320" fill="url(#fond)"/>

  <!-- Bandes de pellicule en haut et en bas -->
  <rect y="0" width="1200" height="28" fill="#e9eef3" opacity="0.92"/>
  <rect y="0" width="1200" height="28" fill="url(#perfos)"/>
  <rect y="292" width="1200" height="28" fill="#e9eef3" opacity="0.92"/>
  <rect y="292" width="1200" height="28" fill="url(#perfos)"/>

  <!-- Clap de cinéma -->
  <g transform="translate(70 62)">
    <!-- corps -->
    <rect x="0" y="52" width="230" height="146" rx="8" fill="#1b1b1f"/>
    <rect x="12" y="104" width="206" height="3" fill="#6b7280"/>
    <rect x="12" y="140" width="206" height="3" fill="#6b7280"/>
    <rect x="12" y="176" width="206" height="3" fill="#6b7280"/>
    <rect x="22" y="72" width="70" height="20" rx="3" fill="#f6c453"/>
    <rect x="104" y="72" width="40" height="20" rx="3" fill="#6b7280"/>
    <rect x="156" y="72" width="52" height="20" rx="3" fill="#6b7280"/>
    <!-- barre fixe -->
    <g transform="translate(0 6)" clip-path="url(#clipClap)">
      <rect width="230" height="46" fill="#1b1b1f"/>
      <g fill="#ffffff">
        <polygon points="-20,46 0,0 34,0 14,46"/>
        <polygon points="48,46 68,0 102,0 82,46"/>
        <polygon points="116,46 136,0 170,0 150,46"/>
        <polygon points="184,46 204,0 238,0 218,46"/>
      </g>
    </g>
    <!-- barre mobile, légèrement ouverte -->
    <g transform="rotate(-14 8 6)">
      <g clip-path="url(#clipClap)">
        <rect width="230" height="46" fill="#1b1b1f"/>
        <g fill="#ffffff">
          <polygon points="-6,46 14,0 48,0 28,46"/>
          <polygon points="62,46 82,0 116,0 96,46"/>
          <polygon points="130,46 150,0 184,0 164,46"/>
          <polygon points="198,46 218,0 252,0 232,46"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Titre -->
  <text x="340" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#ffffff">CinéData</text>
  <text x="344" y="215" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#cfe0ef">ETL · API REST · Recommandation IA · Site web</text>

  <!-- Trois « images » abstraites de film (créations originales) -->
  <g transform="translate(944 60) scale(0.84)">
    <rect x="0" y="0" width="82" height="120" rx="6" fill="url(#ciel)"/>
    <circle cx="41" cy="48" r="16" fill="#fff4d6"/>
    <polygon points="0,120 28,78 50,104 66,88 82,120" fill="#7c2d12" opacity="0.85"/>

    <rect x="96" y="22" width="82" height="120" rx="6" fill="url(#nuit)"/>
    <circle cx="150" cy="52" r="10" fill="#ffffff" opacity="0.9"/>
    <g clip-path="url(#clipCadre2)">
      <rect x="96" y="104" width="82" height="38" fill="#12263a" opacity="0.85"/>
      <polygon points="96,104 112,84 128,104" fill="#12263a"/>
      <polygon points="122,104 142,76 162,104" fill="#12263a"/>
    </g>

    <rect x="192" y="0" width="82" height="120" rx="6" fill="#ecf1f6"/>
    <rect x="204" y="14" width="58" height="8" rx="2" fill="#1f4e79"/>
    <rect x="204" y="30" width="40" height="6" rx="2" fill="#7fa3c4"/>
    <circle cx="233" cy="76" r="26" fill="none" stroke="#e2704a" stroke-width="8"/>
    <polygon points="226,64 226,88 246,76" fill="#e2704a"/>
  </g>
</svg>
